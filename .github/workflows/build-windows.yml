name: Build and publish Windows updater

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set automatic release version
        shell: pwsh
        run: |
          $version = "0.1.$($env:GITHUB_RUN_NUMBER)"
          $env:RELEASE_VERSION = $version
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node -e "const fs=require('fs'); const path='package.json'; const pkg=JSON.parse(fs.readFileSync(path,'utf8')); pkg.version=process.env.RELEASE_VERSION; fs.writeFileSync(path, JSON.stringify(pkg,null,2)+'\n');"

      - name: Create automatic release tag
        shell: pwsh
        run: |
          $tag = "v$env:RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $remoteTag = git ls-remote --refs origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to check whether release tag $tag already exists"
          }

          if ($remoteTag) {
            $remoteCommit = (($remoteTag | Select-Object -First 1) -split '\s+')[0]
            if ($remoteCommit -ne $env:GITHUB_SHA) {
              throw "Release tag $tag already points to $remoteCommit, expected $env:GITHUB_SHA"
            }
            Write-Host "Release tag $tag already exists at this commit"
          } else {
            git tag $tag $env:GITHUB_SHA
            git push origin $tag
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm build

      - name: Package Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec electron-builder --win nsis --publish always

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bl-awards-windows-installer
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error